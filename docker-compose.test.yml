# Test environment: run only docmost and reuse the existing
# docmost DB/Redis on the shared Docker network.
# Usage:
#   docker compose -p test-doc -f docker-compose.test.yml up -d --build --force-recreate
# Requirements:
#   DOCMOST_DB_PASSWORD
#   DOCMOST_PROD_NETWORK=docmost_default

services:
  docmost:
    build:
      context: .
      dockerfile: Dockerfile
    image: docmost-test:local
    environment:
      APP_URL: "${TEST_APP_URL:-https://book-test.superchat.help}"
      APP_SOURCE_URL: "${APP_SOURCE_URL:-https://github.com/wushushuochanpin/docmost}"
      APP_SECRET: "${APP_SECRET:-REPLACE_WITH_LONG_SECRET}"
      DATABASE_URL: "postgresql://docmost:${DOCMOST_DB_PASSWORD}@db:5432/docmost?schema=public"
      REDIS_URL: "redis://redis:6379"
      STORAGE_DRIVER: "${STORAGE_DRIVER:-s3}"
      BACKUP_ENABLED: "${BACKUP_ENABLED:-true}"
      BACKUP_S3_ENABLED: "${BACKUP_S3_ENABLED:-true}"
      BACKUP_S3_PREFIX: "${BACKUP_S3_PREFIX:-backups}"
      AWS_S3_ACCESS_KEY_ID: "${AWS_S3_ACCESS_KEY_ID:-}"
      AWS_S3_SECRET_ACCESS_KEY: "${AWS_S3_SECRET_ACCESS_KEY:-}"
      AWS_S3_REGION: "${AWS_S3_REGION:-}"
      AWS_S3_BUCKET: "${AWS_S3_BUCKET:-}"
      AWS_S3_ENDPOINT: "${AWS_S3_ENDPOINT:-}"
      AWS_S3_FORCE_PATH_STYLE: "${AWS_S3_FORCE_PATH_STYLE:-false}"
      AWS_S3_URL: "${AWS_S3_URL:-}"
      BACKUP_LOCAL_PATH: "/app/data/storage/backups"
      EDITOR_SESSION_ENABLED: "${TEST_EDITOR_SESSION_ENABLED:-true}"
      EDITOR_SESSION_STRICT_WRITE: "${TEST_EDITOR_SESSION_STRICT_WRITE:-true}"
      EDITOR_SESSION_COLLAB_VALIDATE: "${TEST_EDITOR_SESSION_COLLAB_VALIDATE:-true}"
      EDITOR_SESSION_FILE_ENABLED: "${TEST_EDITOR_SESSION_FILE_ENABLED:-true}"
      PORT: "3000"
    ports:
      - "127.0.0.1:3020:3000"
    volumes:
      - docmost_test:/app/data/storage
    networks:
      - prod
    restart: unless-stopped

networks:
  prod:
    external: true
    name: ${DOCMOST_PROD_NETWORK:-docmost_default}

volumes:
  docmost_test:
