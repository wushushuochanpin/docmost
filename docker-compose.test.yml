# Standalone hot-reload environment for local development.
# Usage:
#   cp .env.example .env
#   docker compose -f docker-compose.test.yml up -d --build
# Then open http://localhost:3020 and finish setup at /setup/register.

services:
  docmost:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: docmost-dev:latest
    working_dir: /app
    depends_on:
      - db
      - redis
    env_file:
      - .env
    environment:
      APP_URL: '${APP_URL:-http://localhost:3020}'
      APP_SOURCE_URL: '${APP_SOURCE_URL:-https://github.com/wushushuochanpin/docmost}'
      APP_SECRET: '${APP_SECRET:-REPLACE_WITH_LONG_SECRET}'
      DATABASE_URL: 'postgresql://docmost:${DOCMOST_DB_PASSWORD}@db:5432/docmost?schema=public'
      REDIS_URL: 'redis://redis:6379'
      STORAGE_DRIVER: '${STORAGE_DRIVER:-local}'
      BACKUP_ENABLED: '${BACKUP_ENABLED:-true}'
      BACKUP_S3_ENABLED: '${BACKUP_S3_ENABLED:-false}'
      BACKUP_S3_PREFIX: '${BACKUP_S3_PREFIX:-backups}'
      AWS_S3_ACCESS_KEY_ID: '${AWS_S3_ACCESS_KEY_ID:-}'
      AWS_S3_SECRET_ACCESS_KEY: '${AWS_S3_SECRET_ACCESS_KEY:-}'
      AWS_S3_REGION: '${AWS_S3_REGION:-}'
      AWS_S3_BUCKET: '${AWS_S3_BUCKET:-}'
      AWS_S3_ENDPOINT: '${AWS_S3_ENDPOINT:-}'
      AWS_S3_FORCE_PATH_STYLE: '${AWS_S3_FORCE_PATH_STYLE:-false}'
      AWS_S3_URL: '${AWS_S3_URL:-}'
      BACKUP_LOCAL_PATH: '/app/data/storage/backups'
      PORT: '3000'
      VITE_DEV_HOST: 'true'
      VITE_PROXY_TARGET: 'http://127.0.0.1:3000'
      CI: 'true'
      npm_config_store_dir: '/pnpm/store'
    ports:
      - "127.0.0.1:3020:5173"
    volumes:
      - .:/app
      - docmost_test_node_modules:/app/node_modules
      - docmost_test:/app/data/storage
      - docmost_test_pnpm_store:/pnpm/store
    command: >
      sh -c "pnpm install --frozen-lockfile --prefer-offline --reporter=append-only
      && pnpm --filter @docmost/editor-ext run build
      && rm -f apps/server/tsconfig.build.tsbuildinfo
      && rm -f apps/server/tsconfig.tsbuildinfo
      && rm -rf apps/server/dist
      && pnpm run server:build
      && pnpm --filter ./apps/server run migration:up
      && pnpm concurrently --kill-others-on-fail -n 'backend,frontend' -c 'green,cyan'
      'pnpm --filter ./apps/server run start:prod'
      'pnpm --filter ./apps/client run dev'"
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: docmost
      POSTGRES_USER: docmost
      POSTGRES_PASSWORD: ${DOCMOST_DB_PASSWORD}
    restart: unless-stopped
    volumes:
      - docmost_test_db:/var/lib/postgresql/data

  redis:
    image: redis:7.2-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    restart: unless-stopped
    volumes:
      - docmost_test_redis:/data

volumes:
  docmost_test_node_modules:
  docmost_test:
  docmost_test_pnpm_store:
  docmost_test_db:
  docmost_test_redis:
