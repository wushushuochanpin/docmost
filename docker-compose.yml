services:
  docmost:
    build:
      context: .
      dockerfile: Dockerfile
    image: docmost:local
    depends_on:
      - db
      - redis
    env_file:
      - .env
    environment:
      APP_URL: '${APP_URL:-http://localhost:3000}'
      APP_SOURCE_URL: '${APP_SOURCE_URL:-https://github.com/wushushuochanpin/docmost}'
      DATABASE_URL: 'postgresql://docmost:${DOCMOST_DB_PASSWORD}@db:5432/docmost?schema=public'
      REDIS_URL: 'redis://redis:6379'
      BACKUP_LOCAL_PATH: '/app/data/storage/backups'
      EDITOR_SESSION_ENABLED: '${EDITOR_SESSION_ENABLED:-true}'
      EDITOR_SESSION_STRICT_WRITE: '${EDITOR_SESSION_STRICT_WRITE:-true}'
      EDITOR_SESSION_COLLAB_VALIDATE: '${EDITOR_SESSION_COLLAB_VALIDATE:-true}'
      EDITOR_SESSION_FILE_ENABLED: '${EDITOR_SESSION_FILE_ENABLED:-true}'
    # Loopback-only so only Nginx (80/443) is public; debug via ssh -L
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped
    volumes:
      - docmost:/app/data/storage

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: docmost
      POSTGRES_USER: docmost
      POSTGRES_PASSWORD: ${DOCMOST_DB_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    restart: unless-stopped
    volumes:
      - db_data:/var/lib/postgresql/data

  redis:
    image: redis:7.2-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    restart: unless-stopped
    volumes:
      - redis_data:/data

volumes:
  docmost:
  db_data:
  redis_data:
