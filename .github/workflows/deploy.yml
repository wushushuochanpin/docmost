name: Deploy to book.superchat.help

# Build an immutable image on the repository's ARC runner, then roll that
# exact digest through the in-cluster Kubernetes API. The production host no
# longer pulls source, builds images, or runs docker compose during releases.
on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: docmost-book-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE_REPOSITORY: ghcr.io/wushushuochanpin/docmost
  KUBECTL_VERSION: v1.36.4

jobs:
  backup-regression:
    uses: ./.github/workflows/backup-regression.yml

  deploy:
    needs: backup-regression
    runs-on: docmost-linux-checks
    timeout-minutes: 45
    environment: production
    steps:
      - name: Checkout the candidate
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the immutable application image
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE_REPOSITORY }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=docmost-production-amd64
          # Cache is optional; keep upload bounded after the immutable image is pushed.
          cache-to: type=gha,scope=docmost-production-amd64,mode=min,timeout=2m,ignore-error=true

      - name: Install the pinned Kubernetes client
        run: |
          set -euo pipefail
          arch=$(uname -m)
          case "$arch" in
            x86_64) kubectl_arch=amd64 ;;
            aarch64|arm64) kubectl_arch=arm64 ;;
            *) echo "unsupported runner architecture: $arch" >&2; exit 1 ;;
          esac
          base="https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/${kubectl_arch}"
          curl -fsSLo "$RUNNER_TEMP/kubectl" "$base/kubectl"
          curl -fsSLo "$RUNNER_TEMP/kubectl.sha256" "$base/kubectl.sha256"
          echo "$(cat "$RUNNER_TEMP/kubectl.sha256")  $RUNNER_TEMP/kubectl" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/kubectl"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Verify the production deployment boundary
        run: |
          set -euo pipefail
          kubectl -n docmost get service docmost-postgres >/dev/null
          kubectl -n docmost get service docmost-redis >/dev/null
          kubectl -n docmost get secret docmost-env >/dev/null
          kubectl -n docmost get secret docmost-migration-env >/dev/null
          kubectl -n docmost get secret docmost-backup-env >/dev/null
          kubectl auth can-i create jobs.batch -n docmost | grep -qx yes
          kubectl auth can-i patch deployments.apps -n docmost | grep -qx yes
          kubectl auth can-i create secrets -n docmost | grep -qx yes

      - name: Refresh the registry pull credential
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          kubectl -n docmost create secret docker-registry ghcr-pull \
            --docker-server=ghcr.io \
            --docker-username="${GITHUB_ACTOR}" \
            --docker-password="${GHCR_TOKEN}" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Apply migrations with the isolated migration credential
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          job="docmost-migrate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          manifest="$RUNNER_TEMP/docmost-migration.yaml"
          sed -e "s|__DOCMOST_IMAGE__|${IMAGE_REPOSITORY}@${IMAGE_DIGEST}|g" \
              -e "s|__MIGRATION_JOB__|${job}|g" \
            deploy/k8s/production/migration.yaml > "$manifest"
          kubectl apply --dry-run=server -f "$manifest" >/dev/null
          kubectl apply -f "$manifest"
          # Stop promptly on failure instead of waiting for the full deadline.
          for attempt in $(seq 1 120); do
            succeeded=$(kubectl -n docmost get job "$job" -o jsonpath='{.status.succeeded}')
            failed=$(kubectl -n docmost get job "$job" -o jsonpath='{.status.failed}')
            if [ "${succeeded:-0}" -ge 1 ]; then
              kubectl -n docmost logs "job/$job"
              break
            fi
            if [ "${failed:-0}" -ge 1 ] || [ "$attempt" -eq 120 ]; then
              kubectl -n docmost logs "job/$job" || true
              echo "Database migration failed; application rollout was not started" >&2
              exit 1
            fi
            sleep 5
          done

      - name: Apply the exact image digest
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          test -n "$IMAGE_DIGEST"
          image="${IMAGE_REPOSITORY}@${IMAGE_DIGEST}"
          manifest="$RUNNER_TEMP/docmost-runtime.yaml"
          sed "s|__DOCMOST_IMAGE__|${image}|g" \
            deploy/k8s/production/runtime.yaml > "$manifest"
          ! grep -q '__DOCMOST_IMAGE__' "$manifest"
          kubectl apply --dry-run=server -f "$manifest" >/dev/null

          backup_manifest="$RUNNER_TEMP/docmost-backup.yaml"
          sed "s|__DOCMOST_IMAGE__|${image}|g" deploy/k8s/production/backup-worker.yaml > "$backup_manifest"
          kubectl apply --dry-run=server -f "$backup_manifest" >/dev/null
          previous_backup_image=$(kubectl -n docmost get deployment docmost-backup \
            -o jsonpath='{.spec.template.spec.containers[0].image}' 2>/dev/null || true)
          previous_backup_replicas=$(kubectl -n docmost get deployment docmost-backup \
            -o jsonpath='{.spec.replicas}' 2>/dev/null || true)
          previous_image=$(kubectl -n docmost get deployment docmost \
            -o jsonpath='{.spec.template.spec.containers[?(@.name=="docmost")].image}' \
            2>/dev/null || true)
          rollback() {
            rc=$?
            # Restore worker scale first, including a previously disabled worker.
            if [ -n "$previous_backup_image" ]; then
              kubectl -n docmost set image deployment/docmost-backup "backup=$previous_backup_image" || true
              kubectl -n docmost patch deployment docmost-backup --type=merge \
                -p "{\"spec\":{\"replicas\":${previous_backup_replicas:-0}}}" || true
            else
              kubectl -n docmost patch deployment docmost-backup --type=merge -p '{"spec":{"replicas":0}}' || true
            fi
            if [ -n "$previous_image" ]; then
              echo "Deployment failed; restoring $previous_image" >&2
              kubectl -n docmost set image deployment/docmost "docmost=$previous_image" || true
              kubectl -n docmost rollout status deployment/docmost --timeout=10m || true
            fi
            exit "$rc"
          }
          trap rollback ERR

          kubectl apply -f "$manifest"
          kubectl -n docmost rollout status deployment/docmost --timeout=10m

          # Old application consumers must be drained before the dedicated worker starts.
          kubectl apply -f "$backup_manifest"
          kubectl -n docmost rollout status deployment/docmost-backup --timeout=10m
          test "$(kubectl -n docmost get deployment docmost-backup -o jsonpath='{.spec.template.spec.containers[0].image}')" = "$image"

          current_image=$(kubectl -n docmost get deployment docmost \
            -o jsonpath='{.spec.template.spec.containers[?(@.name=="docmost")].image}')
          test "$current_image" = "$image"
          kubectl -n docmost exec deployment/docmost -- \
            curl -fsS --max-time 15 http://127.0.0.1:3000/api/health >/dev/null

          for attempt in 1 2 3 4 5 6; do
            if curl -fsS --connect-timeout 5 --max-time 20 \
              https://book.superchat.help/api/health >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 6 ]; then
              echo "Public health check failed after $attempt attempts" >&2
              exit 1
            fi
            echo "Public health check attempt $attempt failed; retrying in 5 seconds" >&2
            sleep 5
          done

          # A healthy HTTP server alone cannot prove backup compatibility.
          kubectl -n docmost exec deployment/docmost -- \
            node apps/server/dist/integrations/backup/backup-smoke.js

          kubectl -n docmost annotate deployment docmost \
            "docmost.dev/source-sha=${GITHUB_SHA}" --overwrite
          trap - ERR

      - name: Record the deployed identity
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          echo "source=${GITHUB_SHA}"
          echo "image=${IMAGE_REPOSITORY}@${IMAGE_DIGEST}"
          kubectl -n docmost get deployment docmost -o wide
          kubectl -n docmost get pods -l app.kubernetes.io/name=docmost

      - name: Preserve Kubernetes diagnostics on failure
        if: failure()
        run: |
          kubectl -n docmost describe deployment docmost || true
          kubectl -n docmost get pods -l app.kubernetes.io/name=docmost -o wide || true
          kubectl -n docmost logs deployment/docmost --tail=150 || true
          kubectl -n docmost logs deployment/docmost-backup --tail=100 || true
