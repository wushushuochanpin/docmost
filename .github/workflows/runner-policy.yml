name: Runner policy
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: runner-policy-${{ github.ref }}
  cancel-in-progress: true
jobs:
  runner-policy:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: docmost-linux-checks
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/check-ci-runner-policy.py
      - run: python3 scripts/check-k8s-deployment.py
      - name: Verify execution identity
        run: |
          test "$(id -u)" != 0
          test "$RUNNER_ENVIRONMENT" = "self-hosted"
          [[ "$RUNNER_NAME" == docmost-runner-* ]]
          test "$RUNNER_NAME" = "$(hostname)"
          echo "Self-hosted runner identity verified"
      - name: Verify isolated Docker runtime
        run: |
          # Live ARC uses a per-pod Docker sidecar and an emptyDir socket volume.
          # The daemon must belong to this ephemeral runner, never the business host.
          test "$(id -u)" != 0
          test -S /var/run/docker.sock
          test -w /var/run/docker.sock
          test "$(docker info --format '{{.Name}}')" = "$RUNNER_NAME"
          printf '%s\n' 'FROM busybox:1.37' 'RUN echo runner-build-ok > /proof' 'CMD ["cat", "/proof"]' > "$RUNNER_TEMP/Dockerfile.smoke"
          docker build -t runner-policy-smoke -f "$RUNNER_TEMP/Dockerfile.smoke" "$RUNNER_TEMP"
          test "$(docker run --rm runner-policy-smoke)" = runner-build-ok
      - name: Verify ARM64 release emulation
        run: test "$(docker run --rm --platform linux/arm64 busybox:1.37 uname -m)" = aarch64
