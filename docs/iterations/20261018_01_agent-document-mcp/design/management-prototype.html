<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Agent 连接管理原型</title><style>body{font:14px system-ui;color:#242424;margin:24px;max-width:900px}nav,section,form{display:grid;gap:16px}button,a,input{font:inherit}button{padding:8px 12px}nav{display:flex;flex-wrap:wrap;margin-bottom:24px}dialog{max-width:calc(100vw - 64px);border:1px solid #ccc;border-radius:8px}fieldset{border:1px solid #ddd}label{display:block;margin:12px 0}.error{color:#b42318}</style><nav><a href="#list">我的 Agent 连接</a><a href="#policy">Agent 策略</a><a href="#audit">Agent 审计</a></nav><main></main><dialog><h2>撤销 Codex 的连接？</h2><p>撤销后该应用不能继续访问文档。</p><button id="cancel">取消</button><button id="confirm">确认撤销</button></dialog><script>
let state='active',error=false;const main=document.querySelector('main'),dialog=document.querySelector('dialog');
function render(){const route=location.hash.slice(1)||'list';main.innerHTML=route==='list'?`<h1>我的 Agent 连接</h1><p>Codex · ${state==='active'?'已连接':'已撤销'}</p><a href="#detail">查看连接</a>`:route==='detail'?`<a href="#list">返回连接列表</a><h1>Codex</h1><p role="status">${state==='active'?'已连接':'已撤销'}</p>${error?'<p class="error" role="alert">结果待确认，请重新加载</p><button id="retry">重新加载</button>':''}<fieldset ${state!=='active'?'disabled':''}><legend>访问范围</legend><label><input type="checkbox" checked disabled>读取文档</label><label><input type="checkbox" checked>编辑文档</label><p>只能缩小范围；增加权限需要重新授权。</p><button id="save">保存访问范围</button><button id="revoke">撤销连接</button></fieldset><a href="#activity">查看活动</a><button id="offline">模拟断网</button>`:route==='policy'?'<h1>Agent 策略</h1><label><input type="checkbox" checked>允许 Agent 写入</label><button id="save">保存策略</button>':`<h1>${route==='audit'?'Agent 审计':'连接活动'}</h1><p>暂无活动记录</p><a href="#detail">返回连接详情</a>`;
 document.querySelector('#revoke')?.addEventListener('click',()=>dialog.showModal());document.querySelector('#offline')?.addEventListener('click',()=>{error=true;render()});document.querySelector('#retry')?.addEventListener('click',()=>{error=false;render()});document.querySelector('#save')?.addEventListener('click',()=>{const p=document.createElement('p');p.role='status';p.textContent='已保存';main.append(p)});}
document.querySelector('#cancel').onclick=()=>dialog.close();document.querySelector('#confirm').onclick=()=>{state='revoked';dialog.close();render()};window.onhashchange=render;render();
</script></html>
