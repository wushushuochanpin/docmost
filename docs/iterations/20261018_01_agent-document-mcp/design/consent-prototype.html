<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>连接应用 — 交互原型</title><style>body{font:16px system-ui;background:#f6f7f9;color:#212529;margin:0}main{max-width:520px;margin:48px auto;padding:24px;background:white;border:1px solid #dee2e6;border-radius:8px}button,select{padding:10px;margin:8px 8px 0 0}label{display:block;margin:16px 0}button:disabled{opacity:.5}aside{padding:16px;background:#fff3bf}</style><main><h1>允许应用访问你的文档？</h1><p>示例 Agent 请求连接。只允许访问你选择的空间，且不能超出你的当前权限。</p><p>返回地址：https://agent.example</p><form id="consent"><label><input type="checkbox" checked disabled>读取文档（必需）</label><label><input type="checkbox">编辑文档</label><label><input id="space" type="checkbox">示例空间</label><label>有效期 <select><option>1 天</option><option>7 天</option><option selected>30 天</option><option>90 天</option></select></label><p id="state" role="status">请选择至少一个空间</p><button id="allow" disabled>允许连接</button><button type="button" id="deny">拒绝</button></form><hr><h2>文档恢复状态演示</h2><aside id="editor">应用正在修改文档，暂时无法编辑。未确认保存的内容会保留为本机草稿。</aside><button id="retry">重试编辑</button><button id="draft">查看恢复草稿</button><p id="drafttext" hidden>这是本机恢复草稿。请核对最新文档后手动复制需要的内容；不会自动覆盖文档。</p><hr><h2>连接撤销演示</h2><button id="revoke">撤销连接</button><p id="revoked" role="status"></p></main><script>space.onchange=()=>{allow.disabled=!space.checked;state.textContent=space.checked?'允许后将返回应用':'请选择至少一个空间'};consent.onsubmit=e=>{e.preventDefault();allow.disabled=true;deny.disabled=true;state.textContent='正在连接…';setTimeout(()=>{state.textContent='连接完成，返回应用（原型占位）'},300)};deny.onclick=()=>{state.textContent='已拒绝，返回应用（原型占位）';allow.disabled=true};retry.onclick=()=>{editor.textContent='仍在恢复，请稍后重试。你可以安全离开页面。'};draft.onclick=()=>{drafttext.hidden=false};revoke.onclick=()=>{if(confirm('撤销后，此应用将无法继续访问文档。')){revoked.textContent='已撤销';revoke.disabled=true}};</script></html>
