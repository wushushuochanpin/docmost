# References only. Credential values remain in Kubernetes Secrets.
project: docmost
updated_at: '2026-10-21'
credentials:
  - id: production-runtime
    backend: kubernetes-secret
    host: xenzify-dev
    namespace: docmost
    reference: docmost-env
    variable_names: [DATABASE_URL, AGENT_OAUTH_RESPONSE_KEY, DOCUMENT_COMMAND_SIGNING_KEY]
    consumers: [deployment/docmost]
    database_role: docmost_runtime
    server_only: true
    rotation: Preserve existing keys; OAuth response and document signing keys are independent.
  - id: production-migrations
    backend: kubernetes-secret
    host: xenzify-dev
    namespace: docmost
    reference: docmost-migration-env
    variable_names: [DATABASE_URL]
    consumers: [job/docmost-migrate]
    database_role: docmost
    server_only: true
    restriction: Never inject the migration credential into the application deployment.
  - id: production-backups
    backend: kubernetes-secret
    host: xenzify-dev
    namespace: docmost
    reference: docmost-backup-env
    variable_names: [BACKUP_DATABASE_URL]
    consumers: [deployment/docmost-backup]
    database_role: docmost_backup_reader
    server_only: true
    restriction: SELECT-only BYPASSRLS; never inject into the application or reuse migration credentials.
