apiVersion: v1
kind: Service
metadata:
  name: docmost
  namespace: docmost
  labels:
    app.kubernetes.io/name: docmost
spec:
  # Kept stable because host Nginx proxies this private ClusterIP.
  clusterIP: 10.43.30.30
  selector:
    app.kubernetes.io/name: docmost
  ports:
    - name: http
      port: 3000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: docmost
  namespace: docmost
  labels:
    app.kubernetes.io/name: docmost
spec:
  replicas: 1
  revisionHistoryLimit: 3
  progressDeadlineSeconds: 600
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: docmost
  template:
    metadata:
      labels:
        app.kubernetes.io/name: docmost
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/hostname: vm-0-16-ubuntu
      imagePullSecrets:
        - name: ghcr-pull
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      terminationGracePeriodSeconds: 60
      containers:
        - name: docmost
          image: __DOCMOST_IMAGE__
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - secretRef:
                name: docmost-env
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 4Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          startupProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/health/live
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 4
          volumeMounts:
            - name: storage
              mountPath: /app/data/storage
      volumes:
        - name: storage
          persistentVolumeClaim:
            claimName: docmost-storage
